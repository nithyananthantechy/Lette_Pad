<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Rounded Squircle Badge -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2"/>
  
  <!-- Subtle Tamil Nadu Gopuram / Pillar Outline -->
  <path d="M22 46 L24 24 L32 14 L40 24 L42 46 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.8" stroke-linejoin="round" opacity="0.6"/>
  <path d="M20 46 L44 46" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Central AI Quill / Letter Pad Emblem -->
  <path d="M32 12 L35 22 L45 25 L37 32 L39 42 L32 37 L25 42 L27 32 L19 25 L29 22 Z" fill="url(#goldGrad)" opacity="0.9"/>
  <circle cx="32" cy="27" r="4.5" fill="url(#cyanGrad)"/>
  
  <!-- Digital Circuit Nodes -->
  <circle cx="16" cy="18" r="1.5" fill="#38bdf8"/>
  <circle cx="48" cy="18" r="1.5" fill="#38bdf8"/>
  <path d="M16 18 L24 24 M48 18 L40 24" stroke="#38bdf8" stroke-width="1" stroke-dasharray="2 2" opacity="0.7"/>
